<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Background (Rounded squircle with safe margin) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  
  <!-- Main Ledger / Accounting Tablet Symbol -->
  <g filter="url(#shadow)" transform="translate(116, 106)">
    <!-- Base Tablet Card -->
    <rect x="20" y="20" width="240" height="260" rx="32" fill="#ffffff" />
    
    <!-- Header bar on tablet -->
    <path d="M 20 52 C 20 34.3 34.3 20 52 20 L 228 20 C 245.7 20 260 34.3 260 52 L 260 84 L 20 84 Z" fill="url(#accentGrad)"/>
    
    <!-- Ledger horizontal lines -->
    <rect x="50" y="116" width="180" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="50" y="152" width="130" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="50" y="188" width="160" height="18" rx="9" fill="#e2e8f0"/>
    
    <!-- Checkmark Badge on bottom right -->
    <circle cx="220" cy="230" r="44" fill="#3b82f6" stroke="#ffffff" stroke-width="6"/>
    <path d="M 206 230 L 216 240 L 236 218" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
